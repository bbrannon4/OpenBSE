    minimum_light_output_fraction: 0.2
    reference_points:
      - {x: 14.2, y: 20.2, z: 0.0, fraction_of_zone: 0.25, illuminance_setpoint: 538.0}   # Core_Retail_DaylRefPt1
      - {x: 3.4, y: 20.2, z: 0.0, fraction_of_zone: 0.25, illuminance_setpoint: 538.0}   # Core_Retail_DaylRefPt2

# WaterHeater:Mixed 'Gas Tank', stand-alone (Peak Use Flow Rate on the tank).
# E+ draws the whole use flow from the tank and refills it with mains water;
# use_temperature at the 82.2 °C tank limit makes every fixture take tank
# water only. Off- and on-cycle parasitic gas 1,860 W each, none of it to the
# tank, so 1,860 W of gas all year. Losses to Back_space.
dhw_systems:
  - name: Gas Tank
    mains_temperature:
      correlation:
        annual_avg_temp: 9.95
        max_monthly_delta: 23.7
    water_heater:
      name: Gas Tank
      fuel_type: gas
      tank_volume: 151.4164714   # L
      capacity: 11722.842
      efficiency: 0.82
      setpoint: 60.0                # Hot Water Setpoint Temp Schedule
      deadband: 2.000000
      ua_standby: 4.10807252
      parasitic_power: 1860.0
      ambient_zone: Back_Space
    loads:
      - name: Gas Tank use
        peak_flow_rate: 0.018900   # L/s
        schedule: BLDG_SWH_SCH
        use_temperature: 82.2222244003673

