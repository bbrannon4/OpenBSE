# ============================================================================
# OpenBSE Model: DOE ASHRAE 90.1-2019 Retail Standalone Prototype (Denver, 5B)
# ============================================================================
#
# Transcribed object by object from the DOE prototype IDF
# ASHRAE901_RetailStandalone_STD2019_Denver.idf (E+ 25.2 example file), kept
# with its E+ results in prototype_tests/retail_standalone/eplus_run/.
# Envelope, loads and schedules are generated by
# prototype_tests/retail_standalone/retail_from_idf.py; E+ names, vertices
# (zone origins added) and values are kept. No zone multipliers.
# prototype_tests/retail_standalone/INPUT_AUDIT.md lists every IDF object, how
# it is represented here, and what OpenBSE cannot express yet.
#
# Building: one storey, 2,294 m², 6.096 m floor to roof; five zones (Back_Space,
# Core_Retail, Point_Of_Sale, Front_Retail, Front_Entry). Four packaged
# single-zone units (gas furnace, DX cooling) and a gas unit heater in the
# entry vestibule. Origin at the south-west corner, X east, Y north.
# ============================================================================

simulation:
  timesteps_per_hour: 4            # IDF Timestep
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  terrain: city                    # Building: Terrain City
  solar_distribution: full_interior_and_exterior
  heating_sizing_factor: 1.2       # Sizing:Parameters
  cooling_sizing_factor: 1.2
  unmet_heating_tolerance: 0.556   # OutputControl:ReportingTolerances (1 F)
  unmet_cooling_tolerance: 0.556
  sizing_averaging_window: 6       # Sizing:Parameters timesteps in averaging window
  auto_cooling_design_days: false  # size on the IDF's two design days only
  # RunPeriodControl:SpecialDays (the weather year starts on a Sunday)
  holidays:
    - {month: 1, day: 1}   # New Years Day
    - {month: 1, day: 16}   # MLK Day
    - {month: 2, day: 20}   # Presidents Day
    - {month: 5, day: 29}   # Memorial Day
    - {month: 7, day: 4}   # Independence Day
    - {month: 9, day: 4}   # Labor Day
    - {month: 10, day: 9}   # Columbus Day
    - {month: 11, day: 11}   # Veterans Day
    - {month: 11, day: 23}   # Thanksgiving
    - {month: 12, day: 25}   # Christmas

weather_files:
  - "../weather/USA_CO_Denver-Aurora-Buckley.AFB.724695_TMY3.epw"   # as the E+ run

