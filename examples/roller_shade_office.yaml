# OpenBSE example — interior roller shade and the comfort grid
#
# The comfort_perimeter_office room with a roller shade on its south window.
# The west window is left bare for comparison. The shade drops when more than
# 200 W/m² of beam falls on the glass and lifts again below 150 W/m².
#
# With the shade down it is modelled as its own layer (#144): it absorbs
# part of the sun and gets warm, the room and the comfort grid see its
# temperature instead of the glass, and only its openness lets beam through.
# Compare a sunny winter afternoon in the Workbench's Comfort tab: the south
# sun patch is gone and the band by the shade reads warmer in MRT instead.
#
# Zone air is well mixed, so the comfort grid shows radiant and solar
# variation only; it is not a CFD air-temperature field.
#
# Coordinate system: X=East, Y=North, Z=Up; vertices counter-clockwise as
# seen from outside.

simulation:
  timesteps_per_hour: 4
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  terrain: city

weather_files:
  - ../140_tests/weather/725650TYCST.epw

comfort_grid:
  spacing: 0.5
  wall_offset: 0.5
  occupant: seated
  pmv_limit: 0.5

simple_constructions:
  - name: Exterior Wall
    u_factor: 0.35
    thickness: 0.25
    thermal_capacity: 60000.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough

  - name: Interior Partition
    u_factor: 1.5
    thickness: 0.12
    thermal_capacity: 20000.0
    solar_absorptance: 0.5
    thermal_absorptance: 0.9

  - name: Interior Slab
    u_factor: 2.0
    thickness: 0.2
    thermal_capacity: 400000.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9

window_constructions:
  # Typical low-e double glazing, without blinds, so the sun patch and the
  # cooler glass in winter both show up across the room.
  - name: Low-e Double
    u_factor: 1.8
    shgc: 0.40
    visible_transmittance: 0.60

  - name: Low-e Double + Roller Shade
    u_factor: 1.8
    shgc: 0.40
    visible_transmittance: 0.60
    shading_control:
      type: solar_threshold
      threshold: 200
      hysteresis: 50
      shade:
        solar_transmittance: 0.10
        solar_reflectance: 0.60
        openness: 0.05
        emissivity: 0.9
        distance_to_glass: 0.05

schedules:
  - name: Office Occupancy
    compact:
      weekday: "0 until 8:00, 1.0 until 12:00, 0.5 until 13:00, 1.0 until 17:00, 0"
      weekend: "0"
      holiday: "0"

zones:
  - name: Perimeter Office
    comfort:
      metabolic_rate: 1.1
      # A year-round compromise between summer (0.5 clo) and winter (1.0 clo)
      # office clothing.
      clothing: 0.7
      air_velocity: 0.1

people:
  - name: Office People
    zones: [Perimeter Office]
    count: 4.0
    activity_level: 120.0
    radiant_fraction: 0.3
    schedule: Office Occupancy

lights:
  - name: Office Lights
    zones: [Perimeter Office]
    power: 400.0
    schedule: Office Occupancy

equipment:
  - name: Office Equipment
    zones: [Perimeter Office]
    power: 480.0
    radiant_fraction: 0.3
    schedule: Office Occupancy

infiltration:
  - name: Office Infiltration
    zones: [Perimeter Office]
    air_changes_per_hour: 0.2

ideal_loads:
  - name: Office Ideal Loads
    zones: [Perimeter Office]
    heating_setpoint: 21.0
    cooling_setpoint: 24.0
    heating_capacity: 20000.0
    cooling_capacity: 20000.0

surfaces:
  - name: South Wall
    zone: Perimeter Office
    type: wall
    construction: Exterior Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 3.0}
      - {x: 0.0, y: 0.0, z: 3.0}

  - name: South Window
    zone: Perimeter Office
    type: window
    construction: Low-e Double + Roller Shade
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 0.5, y: 0.0, z: 0.8}
      - {x: 7.5, y: 0.0, z: 0.8}
      - {x: 7.5, y: 0.0, z: 2.6}
      - {x: 0.5, y: 0.0, z: 2.6}

  - name: West Wall
    zone: Perimeter Office
    type: wall
    construction: Exterior Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 3.0}
      - {x: 0.0, y: 6.0, z: 3.0}

  - name: West Window
    zone: Perimeter Office
    type: window
    construction: Low-e Double
    boundary: outdoor
    parent_surface: West Wall
    vertices:
      - {x: 0.0, y: 5.0, z: 0.8}
      - {x: 0.0, y: 1.0, z: 0.8}
      - {x: 0.0, y: 1.0, z: 2.6}
      - {x: 0.0, y: 5.0, z: 2.6}

  - name: North Partition
    zone: Perimeter Office
    type: wall
    construction: Interior Partition
    boundary: adiabatic
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 3.0}
      - {x: 8.0, y: 6.0, z: 3.0}

  - name: East Partition
    zone: Perimeter Office
    type: wall
    construction: Interior Partition
    boundary: adiabatic
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 3.0}
      - {x: 8.0, y: 0.0, z: 3.0}

  - name: Ceiling
    zone: Perimeter Office
    type: ceiling
    construction: Interior Slab
    boundary: adiabatic
    vertices:
      - {x: 0.0, y: 0.0, z: 3.0}
      - {x: 8.0, y: 0.0, z: 3.0}
      - {x: 8.0, y: 6.0, z: 3.0}
      - {x: 0.0, y: 6.0, z: 3.0}

  - name: Floor
    zone: Perimeter Office
    type: floor
    construction: Interior Slab
    boundary: adiabatic
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}

outputs:
  - file: "shade_hourly.csv"
    frequency: hourly
    variables:
      - surface:shade_temperature
      - surface:inside_temperature:South Window
      - surface:blind_deployed:South Window

summary_report: true
