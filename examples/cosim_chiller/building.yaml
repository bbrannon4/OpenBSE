# --- HVAC: Central VAV AHU with CHW Cooling & HW Preheat ---
air_loops:
  - name: VAV AHU
    min_vav_fraction: 0.30
    controls:
      heating_supply_temp: 35.0
      cooling_supply_temp: 13.0
      design_zone_flow: autosize
      cycling: proportional
    equipment:
      - type: fan
        name: VAV Supply Fan
        source: vav
        design_flow_rate: autosize
        pressure_rise: 750.0
        impeller_efficiency: 0.72
        motor_efficiency: 0.90
        motor_in_airstream_fraction: 1.0

      - type: heating_coil
        name: AHU Preheat Coil
        source: hot_water
        capacity: autosize
        setpoint: 35.0

      - type: cooling_coil
        name: AHU CHW Cooling Coil
        source: chilled_water
        capacity: autosize
        shr: 0.80
        setpoint: 13.0
        plant_loop: CHW Loop

    zone_terminals:
      - zone: South Perimeter
        terminal:
          type: vav_box
          name: VAV Box South
          max_air_flow: autosize
          min_flow_fraction: 0.30
          reheat_type: hot_water
          reheat_capacity: autosize
          plant_loop: HHW Loop

      - zone: North Perimeter
        terminal:
          type: vav_box
          name: VAV Box North
          max_air_flow: autosize
          min_flow_fraction: 0.30
          reheat_type: hot_water
          reheat_capacity: autosize
          plant_loop: HHW Loop

      - zone: Core
        terminal:
          type: vav_box
          name: VAV Box Core
          max_air_flow: autosize
          min_flow_fraction: 0.30
          reheat_type: hot_water
          reheat_capacity: autosize
          plant_loop: HHW Loop

# --- Plant Loops ---
plant_loops:
  - name: HHW Loop
    design_supply_temp: 82.0
    design_delta_t: 11.0
    supply_equipment:
      - type: boiler
        name: HHW Boiler
        capacity: autosize
        efficiency: 0.85
        design_outlet_temp: 82.0
        design_water_flow_rate: autosize

  - name: CHW Loop
    design_supply_temp: 7.0
    design_delta_t: 5.0
    supply_equipment:
      # The native chiller is replaced with a Python co-simulation component.
      # OpenBSE spawns chiller.py once at startup and exchanges one JSON message
      # per timestep over stdin/stdout.
      - type: external_plant
        name: Python Chiller
        command: ["python", "chiller.py"]
        inputs:
          - return_temp_c        # entering chilled water temp [°C]
          - return_flow_kg_s     # chilled water mass flow [kg/s]
          - load_request_w       # cooling load requested by coils [W]
          - outdoor_temp_c       # outdoor dry-bulb for condenser penalty [°C]
          - sim_time_s
        outputs:
          - supply_temp_c        # leaving chilled water temp [°C]
          - power_w              # compressor electric power [W]
          - thermal_output_w     # heat removed from water, negative [W]

# --- Thermostats ---
thermostats:
  - name: VAV Office Thermostat
    zones: [VAV Office Zones]
    heating_setpoint: 21.1
    cooling_setpoint: 23.9

# --- Outputs ---
outputs:
  - file: "results.csv"
    frequency: hourly
    variables:
      - zone:temperature
      - zone:heating_rate
      - zone:cooling_rate
      - zone:supply_air_temperature
      - zone:supply_air_mass_flow
      - site:outdoor_temperature
      - component:Python Chiller:power_w
      - component:Python Chiller:thermal_output_w

summary_report: true
