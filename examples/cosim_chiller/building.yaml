# OpenBSE Co-Simulation Example: VAV + Python Chiller
#
# Identical to examples/vav_chw_plant.yaml except the native chiller is
# replaced with an `external_plant` component backed by chiller.py.
#
# This demonstrates the simplest co-simulation use case: swap one plant
# component while leaving everything else — envelope, air loops, controls —
# running inside OpenBSE.
#
# To run:
#   openbse examples/cosim_chiller/building.yaml
#
# OpenBSE will spawn `python chiller.py` (relative to the model directory),
# exchange one JSON message per timestep, and shut it down cleanly at the end.

simulation:
  timesteps_per_hour: 1
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31

weather_files:
  - "/Users/benjaminbrannon/Documents/WeatherFiles/USA_CO_Boulder.Muni.AP.720533_TMYx.2009-2023.epw"

