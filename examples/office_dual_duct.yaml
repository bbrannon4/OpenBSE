# OpenBSE Example: Dual-Duct CAV Office (3 zones)
#
# A 3-zone office building served by a dual-duct constant air volume (CAV)
# AHU. The AHU has a single supply fan feeding two parallel air streams:
#   - Hot deck: heating coil (hot water) → heats to 38°C
#   - Cold deck: cooling coil (DX) → cools to 13°C
#
# Each zone has a DualDuctBox mixing box terminal that blends hot and cold
# deck supply air to meet the zone's load at constant total flow.
#
# Zones:
#   - Perimeter  (120 m², south-facing, high solar/envelope load)
#   - Interior   (200 m², no exterior walls, dominated by internal gains)
#   - Conference (80 m², high occupancy density, intermittent load)
#
# Systems:
#   - DD-AHU-1: dual_duct system, fan + HW heating coil + DX cooling coil
#   - HHW Loop: natural gas boiler supplies hot deck coil
#
# Weather: Boulder, CO TMYx

simulation:
  timesteps_per_hour: 1
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31

weather_files:
  - "/Users/benjaminbrannon/Documents/WeatherFiles/USA_CO_Boulder.Muni.AP.720533_TMYx.2009-2023.epw"

# --- Design Days ---
