# PTHP units — one per guest room
air_loops:
  - name: PTHP Room 101
    system_type: pthp
    zones:
      - zone: Room 101
    controls:
      heating_supply_temp: 45.0
      cooling_supply_temp: 13.0
      cycling: on_off
      heating_setpoint: 21.1
      cooling_setpoint: 23.9
    equipment:
      - type: fan
        name: R101 Fan
        source: on_off
        design_flow_rate: autosize
        pressure_rise: 100.0
        efficiency: 0.7

      - type: heating_coil
        name: R101 HP Heating Coil
        source: heat_pump
        capacity: autosize
        cop: 3.2
        supplemental_capacity: 2000.0
        lockout_temperature: -10.0

      - type: cooling_coil
        name: R101 DX Cooling Coil
        source: dx
        capacity: autosize
        cop: 3.5

