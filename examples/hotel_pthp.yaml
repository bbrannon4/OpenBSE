# OpenBSE Example: Hotel Guest Rooms with Packaged Terminal Heat Pumps (PTHP)
#
# ASHRAE 90.1 Appendix G System 2 analog: PTHP units, one per guest room.
# Each PTHP has a heat pump heating coil (ON/OFF cycling, PLR < 1) and
# a DX cooling coil — no hot-water plant required.
#
# Building: single-floor hotel wing
#   - 4 guest rooms, each ~30 m² (322 sqft), 2.7 m ceiling
#   - All rooms face the same facade (south exposure)
#
# HVAC System per room:
#   - PTHP: on/off fan + heat pump heating coil (COP 3.2)
#     + DX cooling coil + supplemental electric resistance (2000 W)
#   - Compressor lockout below -10°C outdoor
#   - Thermostat: heating 21.1°C (70°F), cooling 23.9°C (75°F)
#
# Weather: Denver, CO (Boulder TMYx)

simulation:
  timesteps_per_hour: 1
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31

weather_files:
  - "/Users/benjaminbrannon/Documents/WeatherFiles/USA_CO_Boulder.Muni.AP.720533_TMYx.2009-2023.epw"

