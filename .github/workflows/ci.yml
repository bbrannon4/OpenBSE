name: CI

on:
  push:
    branches: [main, "physics-review-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace

      - name: Tests
        run: cargo test --workspace

  ashrae140:
    name: ASHRAE 140 Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tamper evidence: the acceptance ranges are the pass/fail law for this
      # suite. Changing them requires updating this pinned hash in the same
      # commit, so any change to the criteria is always an explicit,
      # reviewable diff — the ranges can never drift silently to make a
      # failing engine "pass".
      - name: Verify acceptance ranges are untampered
        run: |
          echo "68e84edb5f605ba5cb735a280edac4fbeccb6bb2f83e4fac3d6af710a20cb31a  140_tests/acceptance_ranges_140_2023.json" | sha256sum -c -

      - name: Build release
        run: cargo build --release

      # The normative weather CSV is licensed (gitignored); reconstruct it
      # from the in-repo EPW. This exercises the SAME TMY3 input path as
      # local validation (verified identical to 0.1 kWh on all cases).
      - name: Reconstruct normative weather
        run: python3 140_tests/scripts/reconstruct_140_weather.py

      # Fail hard on any case that crashes — a missing summary must never
      # silently read as a pass.
      - name: Run all 140 cases
        working-directory: 140_tests/cases
        run: |
          for yaml in ashrae140_case[0-9ACH]*.yaml; do
            echo "::group::$(basename "$yaml")"
            ../../target/release/openbse "$yaml" || { echo "CASE FAILED TO RUN: $yaml"; exit 1; }
            echo "::endgroup::"
          done

      - name: Check acceptance ranges
        run: python3 140_tests/scripts/build_140_csv.py --ci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashrae140-results
          path: 140_tests/scripts/FULL_140_RESULTS.csv

  # Every model in examples/ and prototype_tests/ must run, pass the sanity
  # gates and match its committed end-use baseline (tests/README.md).
  shipped-models:
    name: Shipped models (fast tier)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tamper evidence, as for the ASHRAE 140 ranges: the baselines and the
      # per-model thresholds are the pass/fail law for this job. Changing
      # either requires updating its pinned hash here in the same commit.
      - name: Verify model baselines are untampered
        run: |
          sha256sum -c - <<'SUMS'
          b4f9462e494f166ba60fcd7af74edd525e296cf0df5fd546ffa2c443917fa857  tests/model_baselines.json
          a798668f58c710f84af7a3297bf4b00e88bc35778eed5d98eafa5a60ff30ff0e  tests/model_checks.json
          SUMS

      - name: Build release
        run: cargo build --release

      - name: Run shipped models
        run: python3 tests/run_shipped_models.py --tier fast --jobs 4 --report shipped-models-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-models-report
          path: shipped-models-report.json

  # Apartment and Hospital take 6-15 min each, so they run on demand and
  # after every merge to main rather than on each PR. The LargeOffice models
  # are tier "local": they need more memory than this runner's 16 GB.
  shipped-models-slow:
    name: Shipped models (slow tier)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify model baselines are untampered
        run: |
          sha256sum -c - <<'SUMS'
          b4f9462e494f166ba60fcd7af74edd525e296cf0df5fd546ffa2c443917fa857  tests/model_baselines.json
          a798668f58c710f84af7a3297bf4b00e88bc35778eed5d98eafa5a60ff30ff0e  tests/model_checks.json
          SUMS

      - name: Build release
        run: cargo build --release

      - name: Run slow models
        run: python3 tests/run_shipped_models.py --tier slow --jobs 1 --report shipped-models-slow-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-models-slow-report
          path: shipped-models-slow-report.json
