name: CI

on:
  push:
    branches: [main, "physics-review-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace

      - name: Tests
        run: cargo test --workspace

  ashrae140:
    name: ASHRAE 140 Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tamper evidence: the acceptance ranges are the pass/fail law for this
      # suite. Changing them requires updating this pinned hash in the same
      # commit, so any change to the criteria is always an explicit,
      # reviewable diff — the ranges can never drift silently to make a
      # failing engine "pass".
      - name: Verify acceptance ranges are untampered
        run: |
          echo "68e84edb5f605ba5cb735a280edac4fbeccb6bb2f83e4fac3d6af710a20cb31a  140_tests/acceptance_ranges_140_2023.json" | sha256sum -c -

      - name: Build release
        run: cargo build --release

      # The normative weather CSV is licensed (gitignored); reconstruct it
      # from the in-repo EPW. The reconstruction equals the normative
      # 725650TY.csv in every column the engine reads (#507).
      - name: Reconstruct normative weather
        run: python3 140_tests/scripts/reconstruct_140_weather.py

      # Each case's weather file is the Standard's normative file, converted
      # field for field (Section 9 and 11 from TMY2, Section 10 from WYEC2,
      # Section 7 reconstructed as above); conformance_spec.json pins which
      # file each case reads. Changing a file requires updating its hash here.
      - name: Verify normative weather files
        run: |
          sha256sum -c - <<'SUMS'
          cf458101475d2b2095bedc4d08148f5b47b3903ccce260c34eaa3020eb0e957e  140_tests/weather/HE100W.csv
          9deb9b27577a7692ba31d676595a3aff95f9233e3568592150b95e15b531fde9  140_tests/weather/HE120W.csv
          87c40b576be68089c5c443567b44ed4a683a1e0aa47927d71e9672db736b42bb  140_tests/weather/HE130W.csv
          fe4e138fccf30efe5c5bc503994e279e662a5030d3ba512ed8d25c2c067895c7  140_tests/weather/HE140W.csv
          96bd58cb853a065ad778ae35438693f7d32c34622e95fcc8874d6095c5744376  140_tests/weather/HE210W.csv
          22d45f6deb4d9f4fb7c7639292fef520404d2393a74ae8082c1ecbf9c1021762  140_tests/weather/AE101.csv
          89bf8313aeebdf48cc83e9278d80cac9ce7d4ebba9a98ad436c91049121f36cb  140_tests/weather/AE103.csv
          4eed66f9c2c4c7fb399f5496e0a227a2e40dcfd0e129d9d76b13665ffe070548  140_tests/weather/AE104.csv
          48b8461cd1383d2a7d62cbe9d74eae54f2436c42f1a623ebc759f8030ee27e2b  140_tests/weather/AE105.csv
          9387ba2e245973711b699847b761ba5b8b8025410a16bfc47252a3e78e818e73  140_tests/weather/AE106.csv
          93e18a83ac93038388f11b17b180710a8b9e046cd832d20158a867f67a08ee76  140_tests/cases/CE100A.csv
          8163e523cdc856a2ccd0a2b6e5f9291c48fab251b6382b3798396dfb566f53fa  140_tests/cases/CE110A.csv
          bffe8602ddd3ed47f050e469fef5d702bf8371fad1a49a57bddbd43b88f50d5e  140_tests/cases/CE165A.csv
          35461caa566a5405b8c9c40c9bc0cf6ee5c6c68bfdea6de451595571f016167e  140_tests/cases/CE200A.csv
          1ab55ce0f60ab29bb205f2eec00cd89c1319865bf540bbbaf9ae7f7ff7d9e012  140_tests/cases/CE300.csv
          b3d6d975b4f02031d65b23d26a93d25b1ae375e2819a60cbce0f53f85d07f3b8  140_tests/weather/725650TYCST.epw
          b7bc66f6e3c68e205403fa3747b1ffc7dfb75b1dcdf154d5363bc269a8f4b8aa  140_tests/cases/ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv
          SUMS

      # Fail hard on any case that crashes — a missing summary must never
      # silently read as a pass.
      - name: Run all 140 cases
        working-directory: 140_tests/cases
        run: |
          for yaml in ashrae140_case[0-9ACH]*.yaml; do
            echo "::group::$(basename "$yaml")"
            ../../target/release/openbse "$yaml" || { echo "CASE FAILED TO RUN: $yaml"; exit 1; }
            echo "::endgroup::"
          done

      - name: Check acceptance ranges
        run: python3 140_tests/scripts/build_140_csv.py --ci

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashrae140-results
          path: 140_tests/scripts/FULL_140_RESULTS.csv

  # Every model in examples/ and prototype_tests/ must run, pass the sanity
  # gates and match its committed end-use baseline (tests/README.md).
  shipped-models:
    name: Shipped models (fast tier)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tamper evidence, as for the ASHRAE 140 ranges: the baselines and the
      # per-model thresholds are the pass/fail law for this job. Changing
      # either requires updating its pinned hash here in the same commit.
      - name: Verify model baselines are untampered
        run: |
          sha256sum -c - <<'SUMS'
          d748ea2299811a0795ad21d9746dde72e314c45e771f2fceb1874cd7479c37cb  tests/model_baselines.json
          39b00c5e19642685af235f3d49eb91869feca4efdd44caad3dfdf8cd60839d91  tests/model_checks.json
          SUMS

      - name: Build release
        run: cargo build --release

      - name: Run shipped models
        run: python3 tests/run_shipped_models.py --tier fast --jobs 4 --report shipped-models-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-models-report
          path: shipped-models-report.json

  # Apartment and Hospital take 6-15 min each, so they run on demand and
  # after every merge to main rather than on each PR. The LargeOffice models
  # are tier "local": they need more memory than this runner's 16 GB.
  shipped-models-slow:
    name: Shipped models (slow tier)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify model baselines are untampered
        run: |
          sha256sum -c - <<'SUMS'
          d748ea2299811a0795ad21d9746dde72e314c45e771f2fceb1874cd7479c37cb  tests/model_baselines.json
          39b00c5e19642685af235f3d49eb91869feca4efdd44caad3dfdf8cd60839d91  tests/model_checks.json
          SUMS

      - name: Build release
        run: cargo build --release

      - name: Run slow models
        run: python3 tests/run_shipped_models.py --tier slow --jobs 1 --report shipped-models-slow-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipped-models-slow-report
          path: shipped-models-slow-report.json
