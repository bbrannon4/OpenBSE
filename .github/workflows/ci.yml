name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace

      - name: Tests
        run: cargo test --workspace

  ashrae140:
    name: ASHRAE 140 Regression
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release
        run: cargo build --release

      - name: Run all 140 cases
        run: |
          for yaml in 140_tests/cases/ashrae140_case[0-9]*.yaml; do
            echo "::group::$(basename "$yaml")"
            ./target/release/openbse "$yaml" -w 140_tests/weather/725650TYCST.epw || echo "WARN: $yaml exited non-zero"
            echo "::endgroup::"
          done

      - name: Check for regressions
        run: python3 140_tests/scripts/build_140_csv.py --ci
