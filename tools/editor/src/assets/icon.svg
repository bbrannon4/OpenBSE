<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="100%" stop-color="#24253a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="50%" stop-color="#9ece6a"/>
      <stop offset="100%" stop-color="#f7768e"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect width="128" height="128" rx="24" stroke="#2f3146" stroke-width="1"/>
  <!-- BSE letters -->
  <text x="64" y="68" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="800" fill="#c0caf5" letter-spacing="3">
    BSE
  </text>
  <!-- Accent bar -->
  <rect x="18" y="80" width="92" height="4" rx="2" fill="url(#accent)"/>
  <!-- "Open" prefix small -->
  <text x="64" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#565f89" letter-spacing="4">
    OPEN
  </text>
</svg>
