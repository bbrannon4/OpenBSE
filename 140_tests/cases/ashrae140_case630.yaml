# OpenBSE ASHRAE Standard 140 — Case 630
#
# Case 630: East/West Windows with Overhangs and Fins
#
# Single-zone low-mass building in Denver, CO (Golden, CO weather)
# Reference: ASHRAE Standard 140-2023, Section 7.2.2.1.3
#
# Building: 8m (E-W) x 6m (N-S) x 2.7m height = 129.6 m3
# Same as Case 620 (east/west windows) PLUS horizontal overhangs and
# vertical side fins on each window.
#
# Shading geometry (IEA BESTEST Table 1-14, ASHRAE 140 Figure 7-12):
#   Each east/west window (3m wide x 2m tall):
#     Overhang: 1.0m projection, 0.5m gap above window top (at eave z=2.7)
#     Left fin:  1.0m projection, full wall height (z=0.0 to z=2.7)
#     Right fin: 1.0m projection, full wall height (z=0.0 to z=2.7)
#
# Coordinate system: X=East, Y=North, Z=Up
# Origin: SW corner of floor at ground level
#
# HVAC: Ideal loads air system, nonproportional thermostat
#   Heat ON if T < 20C, Cool ON if T > 27C
#   Capacity: 1 MW each (effectively unlimited)
#
# Vertex order: Counter-clockwise from outside (Newell convention)

simulation:
  timesteps_per_hour: 4
  terrain: country
  shading_calculation: detailed
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31

weather_files:
  - "ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv"

# ─── Opaque Constructions ──────────────────────────────────────────────────
# Layer properties of ASHRAE 140-2023 Section 7.2: the material tables for
# Cases 600, 680, 900, 960 (common wall) and 980, numbered Tables 5-2, 5-25,
# 5-27, 5-29 and 5-31 in 140-2017 Addendum a. Floor insulation is massless
# ("minimum density and specific heat the program allows"). Solar
# absorptance 0.6 and infrared emittance 0.9 on both faces (Table 5-5);
# exterior surfaces rough (Table 5-6).

materials:
  - name: Wood Siding
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Fiberglass Quilt
    conductivity: 0.04
    density: 12.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Plasterboard
    conductivity: 0.16
    density: 950.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Roof Deck
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Floor Insulation Low Mass
    thermal_resistance: 25.075
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Timber Flooring
    conductivity: 0.14
    density: 650.0
    specific_heat: 1200.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9

constructions:
  # Table 5-2, outside to inside
  - name: Case600 Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Fiberglass Quilt
        thickness: 0.066
      - material: Plasterboard
        thickness: 0.012
  # Table 5-2, outside to inside
  - name: Case600 Roof
    layers:
      - material: Roof Deck
        thickness: 0.019
      - material: Fiberglass Quilt
        thickness: 0.1118
      - material: Plasterboard
        thickness: 0.01
  # Table 5-2, outside to inside
  - name: Case600 Floor
    layers:
      - material: Floor Insulation Low Mass
        thickness: 1.003
      - material: Timber Flooring
        thickness: 0.025

glazing_materials:
  # Clear glass pane of the standard (WINDOW 7 CLEAR_3)
  - name: Clear Glass
    thickness: 0.003048    # 3.048 mm (Section 7.2, Table 5-10)
    conductivity: 1.0
    solar_transmittance: 0.834
    solar_reflectance_front: 0.075
    solar_reflectance_back: 0.075
    emissivity_front: 0.84
    emissivity_back: 0.84

window_constructions:
  - name: Case600 Window
    # U-factor and SHGC follow from the layers.
    layers:
      - glazing: Clear Glass
      - gas: air
        width: 0.012
      - glazing: Clear Glass

# ─── Outputs ──────────────────────────────────────────────────────────────────

outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - zone_temperature
      - zone_heating_rate
      - zone_cooling_rate
      - site_outdoor_temperature

  - file: "energy_monthly.csv"
    frequency: monthly
    variables:
      - zone_heating_energy
      - zone_cooling_energy

summary_report: true

# ─── Zone ────────────────────────────────────────────────────────────────────

zones:
  - name: Case630 Zone
    solar_distribution:
      floor_fraction: 0.642
      wall_fraction: 0.191
      ceiling_fraction: 0.167

equipment:
  - name: Internal Gains
    zones: [Case630 Zone]
    power: 200.0
    fuel: none
    radiant_fraction: 0.6

infiltration:
  - name: Zone Infiltration
    zones: [Case630 Zone]
    air_changes_per_hour: 0.5

ideal_loads:
  - name: Zone Ideal Loads
    zones: [Case630 Zone]
    heating_setpoint: 20.0
    cooling_setpoint: 27.0
    heating_capacity: 1000000.0
    cooling_capacity: 1000000.0

# ─── Surfaces with 3D Vertices ──────────────────────────────────────────────
# Case 630: Same as Case 620 (east/west windows) with overhangs and fins.

surfaces:
  # ── South Wall (faces south, normal = -Y) ──────────────────────────
  # No windows in Case 620/630 (windows are on east/west walls)
  - name: South Wall
    zone: Case630 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  # ── North Wall (faces north, normal = +Y) ──────────────────────────
  - name: North Wall
    zone: Case630 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}

  # ── East Wall (faces east, normal = +X) ────────────────────────────
  - name: East Wall
    zone: Case630 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  # ── East Window (on east wall) ──────────────────────────────────────
  # 3m wide x 2m tall, centered on east wall
  # Window + overhangs and fins using the shading: field
  - name: East Window
    zone: Case630 Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: East Wall
    vertices:
      - {x: 8.0, y: 1.5, z: 0.2}
      - {x: 8.0, y: 4.5, z: 0.2}
      - {x: 8.0, y: 4.5, z: 2.2}
      - {x: 8.0, y: 1.5, z: 2.2}
    shading:
      overhang:
        depth: 1.0
        offset_above: 0.5        # 0.5m gap above window top → overhang at eave (z=2.7)
      left_fin:
        depth: 1.0
        extend_below: 0.2        # extend from window bottom (z=0.2) to ground (z=0.0)
        extend_above: 0.5        # extend from window top (z=2.2) to eave (z=2.7)
      right_fin:
        depth: 1.0
        extend_below: 0.2
        extend_above: 0.5

  # ── West Wall (faces west, normal = -X) ────────────────────────────
  - name: West Wall
    zone: Case630 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  # ── West Window (on west wall) ──────────────────────────────────────
  # 3m wide x 2m tall, centered on west wall
  # Window + overhangs and fins using the shading: field
  - name: West Window
    zone: Case630 Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: West Wall
    vertices:
      - {x: 0.0, y: 4.5, z: 0.2}
      - {x: 0.0, y: 1.5, z: 0.2}
      - {x: 0.0, y: 1.5, z: 2.2}
      - {x: 0.0, y: 4.5, z: 2.2}
    shading:
      overhang:
        depth: 1.0
        offset_above: 0.5        # 0.5m gap above window top → overhang at eave (z=2.7)
      left_fin:
        depth: 1.0
        extend_below: 0.2        # extend from window bottom (z=0.2) to ground (z=0.0)
        extend_above: 0.5        # extend from window top (z=2.2) to eave (z=2.7)
      right_fin:
        depth: 1.0
        extend_below: 0.2
        extend_above: 0.5

  # ── Roof (faces up, normal = +Z) ───────────────────────────────────
  - name: Roof
    zone: Case630 Zone
    type: roof
    construction: Case600 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  # ── Floor (faces down, normal = -Z) ────────────────────────────────
  - name: Floor
    zone: Case630 Zone
    type: floor
    construction: Case600 Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
