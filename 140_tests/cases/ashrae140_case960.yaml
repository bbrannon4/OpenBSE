# OpenBSE ASHRAE Standard 140 — Case 960
#
# Case 960: Sunspace (Two-Zone)
#
# Reference: ASHRAE Standard 140-2023, Section 7.2.2.1.6
#
# Two thermal zones:
#   Back Zone: 8m (E-W) x 6m (N-S) x 2.7m = 129.6 m3, conditioned
#   Sun Zone:  8m (E-W) x 2m (N-S) x 2.7m =  43.2 m3, unconditioned
#
# Sun Zone is attached to the south side of Back Zone.
# Common wall: 200mm concrete block (no insulation), high thermal mass.
# Two south-facing clear double-pane windows (same as Case 600) in Sun Zone.
#
# Back Zone: lightweight (Case 600) walls/floor, lightweight roof, 0.5 ACH, 200W internal gains
# Sun Zone:  heavyweight (Case 900) walls/floor, lightweight roof, 0.5 ACH, no internal gains
#
# HVAC: Ideal loads in Back Zone only (heat < 20C, cool > 27C)
#       Sun Zone floats freely.
#
# Coordinate system: X=East, Y=North, Z=Up
# Back Zone: (0,0) to (8,6)
# Sun Zone:  (0,-2) to (8,0)
# Origin: SW corner of Back Zone floor
#
# Construction notes (verified against E+ reference IDF Case960.idf):
#   Back Zone N/E/W walls: LTWALL (wood siding + fiberglass + plasterboard), lightweight
#   Back Zone floor: LTFLOOR (R-25 insulation + timber flooring), lightweight
#   Back Zone roof: LTROOF (roof deck + fiberglass + plasterboard), lightweight
#   Sun Zone S/E/W walls: HWWALL (wood siding + foam + concrete block), heavyweight
#   Sun Zone floor: HWFLOOR (R-25 insulation + concrete slab), heavyweight
#   Sun Zone roof: LTROOF (same as back zone), lightweight
#   Common wall: 200mm concrete block single layer
#   Sun Zone windows: double-pane clear glass (U=3.0, SHGC=0.769)
#
# NOTE: Back Zone uses LIGHTWEIGHT construction (same as Case 600),
#       NOT heavyweight. The E+ IDF confirms LTWALL/LTFLOOR for Back Zone.

simulation:
  timesteps_per_hour: 4
  # Geometric interior beam projection (matches the E+ reference IDF's
  # FullInteriorAndExterior). Essential here: winter beam through the south
  # glazing of the 2 m-deep sunspace lands mostly on the massive common
  # wall; the previous hand-estimated fixed fractions spread it
  # area-weighted over all walls, under-charging the wall and
  # over-predicting back-zone heating (issue #101).
  solar_distribution: full_interior_and_exterior
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  terrain: country

weather_files:
  - "ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv"

# ─── Constructions ─────────────────────────────────────────────────────────────
# ─── Opaque Constructions ──────────────────────────────────────────────────
# Layer properties of ASHRAE 140-2023 Section 7.2: the material tables for
# Cases 600, 680, 900, 960 (common wall) and 980, numbered Tables 5-2, 5-25,
# 5-27, 5-29 and 5-31 in 140-2017 Addendum a. Floor insulation is massless
# ("minimum density and specific heat the program allows"). Solar
# absorptance 0.6 and infrared emittance 0.9 on both faces (Table 5-5);
# exterior surfaces rough (Table 5-6).

materials:
  - name: Wood Siding
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Fiberglass Quilt
    conductivity: 0.04
    density: 12.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Plasterboard
    conductivity: 0.16
    density: 950.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Floor Insulation Low Mass
    thermal_resistance: 25.075
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Timber Flooring
    conductivity: 0.14
    density: 650.0
    specific_heat: 1200.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Roof Deck
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Foam Insulation
    conductivity: 0.04
    density: 10.0
    specific_heat: 1400.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Concrete Block
    conductivity: 0.51
    density: 1400.0
    specific_heat: 1000.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Floor Insulation High Mass
    thermal_resistance: 25.175
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Concrete Slab
    conductivity: 1.13
    density: 1400.0
    specific_heat: 1000.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9

constructions:
  # Table 5-2, outside to inside
  - name: Case600 Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Fiberglass Quilt
        thickness: 0.066
      - material: Plasterboard
        thickness: 0.012
  # Table 5-2, outside to inside
  - name: Case600 Floor
    layers:
      - material: Floor Insulation Low Mass
        thickness: 1.003
      - material: Timber Flooring
        thickness: 0.025
  # Table 5-2, outside to inside
  - name: Case900 Roof
    layers:
      - material: Roof Deck
        thickness: 0.019
      - material: Fiberglass Quilt
        thickness: 0.1118
      - material: Plasterboard
        thickness: 0.01
  # Table 5-27, outside to inside
  - name: SunZone Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Foam Insulation
        thickness: 0.0615
      - material: Concrete Block
        thickness: 0.1
  # Table 5-27, outside to inside
  - name: SunZone Floor
    layers:
      - material: Floor Insulation High Mass
        thickness: 1.007
      - material: Concrete Slab
        thickness: 0.08
  # Table 5-29, outside to inside
  - name: Common Wall
    layers:
      - material: Concrete Block
        thickness: 0.2

glazing_materials:
  # Clear glass pane of the standard (WINDOW 7 CLEAR_3)
  - name: Clear Glass
    thickness: 0.003048    # 3.048 mm (Section 7.2, Table 5-10)
    conductivity: 1.0
    solar_transmittance: 0.834
    solar_reflectance_front: 0.075
    solar_reflectance_back: 0.075
    emissivity_front: 0.84
    emissivity_back: 0.84

window_constructions:
  # Case 600 Window: double-pane clear glass (same as Case 600 standard glass)
  - name: Case600 Window
    # U-factor and SHGC follow from the layers.
    layers:
      - glazing: Clear Glass
      - gas: air
        width: 0.012
      - glazing: Clear Glass

# ─── Outputs ──────────────────────────────────────────────────────────────────

outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - zone_temperature
      - zone_heating_rate
      - zone_cooling_rate
      - site_outdoor_temperature

  - file: "energy_monthly.csv"
    frequency: monthly
    variables:
      - zone_heating_energy
      - zone_cooling_energy

summary_report: true

# ─── Zones ────────────────────────────────────────────────────────────────────

zones:
  - name: Back Zone

  - name: Sun Zone

# ─── Equipment, Infiltration, HVAC ────────────────────────────────────────────

equipment:
  - name: Internal Gains
    zones: [Back Zone]
    power: 200.0
    fuel: none
    radiant_fraction: 0.6

infiltration:
  - name: Back Zone Infiltration
    zones: [Back Zone]
    air_changes_per_hour: 0.5
  - name: Sun Zone Infiltration
    zones: [Sun Zone]
    air_changes_per_hour: 0.5

# Only Back Zone is conditioned; Sun Zone floats freely
ideal_loads:
  - name: Back Zone Ideal Loads
    zones: [Back Zone]
    heating_setpoint: 20.0
    cooling_setpoint: 27.0
    heating_capacity: 1000000.0
    cooling_capacity: 1000000.0

# ═══════════════════════════════════════════════════════════════════════════════
# SURFACES
# ═══════════════════════════════════════════════════════════════════════════════
# Vertices are CCW from outside (Newell convention).
# Back Zone: (0,0)–(8,6), Sun Zone: (0,-2)–(8,0)

surfaces:
  # ═══ BACK ZONE ══════════════════════════════════════════════════════════════

  # ── South Wall (interzone, facing Sun Zone) ─────────────────────────────
  # Common wall: 200mm concrete block, high thermal mass
  - name: Back South Wall
    zone: Back Zone
    type: wall
    construction: Common Wall
    boundary: !zone "Sun Zone"
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  # ── North Wall (outdoor, lightweight) ───────────────────────────────────
  - name: Back North Wall
    zone: Back Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}

  # ── East Wall (outdoor, lightweight) ────────────────────────────────────
  - name: Back East Wall
    zone: Back Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  # ── West Wall (outdoor, lightweight) ────────────────────────────────────
  - name: Back West Wall
    zone: Back Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  # ── Roof (outdoor, lightweight) ─────────────────────────────────────────
  - name: Back Roof
    zone: Back Zone
    type: roof
    construction: Case900 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  # ── Floor (ground, lightweight) ─────────────────────────────────────────
  - name: Back Floor
    zone: Back Zone
    type: floor
    construction: Case600 Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}

  # ═══ SUN ZONE (Sunspace) ═══════════════════════════════════════════════

  # ── North Wall (interzone, facing Back Zone — reciprocal of Back South) ─
  - name: Sun North Wall
    zone: Sun Zone
    type: wall
    construction: Common Wall
    boundary: !zone "Back Zone"
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  # ── South Wall (outdoor, heavyweight, with two clear windows) ───────────
  - name: Sun South Wall
    zone: Sun Zone
    type: wall
    construction: SunZone Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: -2.0, z: 0.0}
      - {x: 8.0, y: -2.0, z: 0.0}
      - {x: 8.0, y: -2.0, z: 2.7}
      - {x: 0.0, y: -2.0, z: 2.7}

  # ── South Window 1 (west side, sill=0.5m, head=2.5m per E+ ref) ────────
  - name: Sun Window 1
    zone: Sun Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: Sun South Wall
    vertices:
      - {x: 0.5, y: -2.0, z: 0.5}
      - {x: 3.5, y: -2.0, z: 0.5}
      - {x: 3.5, y: -2.0, z: 2.5}
      - {x: 0.5, y: -2.0, z: 2.5}

  # ── South Window 2 (east side, sill=0.5m, head=2.5m per E+ ref) ────────
  - name: Sun Window 2
    zone: Sun Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: Sun South Wall
    vertices:
      - {x: 4.5, y: -2.0, z: 0.5}
      - {x: 7.5, y: -2.0, z: 0.5}
      - {x: 7.5, y: -2.0, z: 2.5}
      - {x: 4.5, y: -2.0, z: 2.5}

  # ── East Wall (outdoor, heavyweight, sun zone depth = 2m) ──────────────
  - name: Sun East Wall
    zone: Sun Zone
    type: wall
    construction: SunZone Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: -2.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: -2.0, z: 2.7}

  # ── West Wall (outdoor, heavyweight, sun zone depth = 2m) ──────────────
  - name: Sun West Wall
    zone: Sun Zone
    type: wall
    construction: SunZone Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: -2.0, z: 0.0}
      - {x: 0.0, y: -2.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  # ── Roof (outdoor, lightweight) ─────────────────────────────────────────
  - name: Sun Roof
    zone: Sun Zone
    type: roof
    construction: Case900 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: -2.0, z: 2.7}
      - {x: 8.0, y: -2.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  # ── Floor (ground, heavyweight) ─────────────────────────────────────────
  - name: Sun Floor
    zone: Sun Zone
    type: floor
    construction: SunZone Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: -2.0, z: 0.0}
      - {x: 0.0, y: -2.0, z: 0.0}
