# OpenBSE ASHRAE Standard 140 — Case 395
#
# Case 395: Solid conduction test
# ASHRAE Standard 140-2023, Section 7.2.3.16 (in-depth test, 7.2.3).
# Base cases (Informative Table 7-33): 400, 195.
#
# Case 600 except:
#   - Infiltration 0 ach (7.2.3.15.1); internal gains 0 W (7.2.3.15.2)
#   - Exterior solar absorptance 0.1 on all opaque surfaces but the raised
#     floor, high-conductance wall elements included (7.2.3.15.3)
#   - Lightweight exterior wall of Table 7-2 in place of the high-conductance
#     wall elements: rough outside, smooth inside, radiative properties of the
#     Case 400 walls (7.2.3.16)
#   - "20,27" thermostat as Case 600
#
# Generated by 140_tests/scripts/generate_indepth_cases.py; edit there.
# No acceptance ranges (Annex A3 has none for 7.2.3); results reported only.
# Coordinates: X = east, Y = north, Z = up; vertices counter-clockwise
# seen from outside.

simulation:
  timesteps_per_hour: 4
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  terrain: country
  solar_distribution: full_interior_and_exterior

weather_files:
  - "ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv"

materials:
  - name: Wood Siding
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.9
    roughness: rough
  - name: Fiberglass Quilt
    conductivity: 0.04
    density: 12.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Plasterboard
    conductivity: 0.16
    density: 950.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Roof Deck
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.9
    roughness: rough
  - name: Floor Insulation Low Mass
    thermal_resistance: 25.075
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Timber Flooring
    conductivity: 0.14
    density: 650.0
    specific_heat: 1200.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9

constructions:
  # Table 7-2, outside to inside
  - name: Case600 Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Fiberglass Quilt
        thickness: 0.066
      - material: Plasterboard
        thickness: 0.012
  # Table 7-2, outside to inside
  - name: Case600 Roof
    layers:
      - material: Roof Deck
        thickness: 0.019
      - material: Fiberglass Quilt
        thickness: 0.1118
      - material: Plasterboard
        thickness: 0.01
  # Table 7-2, outside to inside
  - name: Case600 Floor
    layers:
      - material: Floor Insulation Low Mass
        thickness: 1.003
      - material: Timber Flooring
        thickness: 0.025

# Output of 7.3.1: annual loads and hourly integrated peaks.
outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - zone_temperature
      - zone_heating_rate
      - zone_cooling_rate
      - site_outdoor_temperature

summary_report: true

zones:
  - name: Case395 Zone

# Ideal loads: nonproportional thermostat (7.2.1.13.1.2), 1000 kW each,
# 100% convective.
ideal_loads:
  - name: Zone Ideal Loads
    zones: [Case395 Zone]
    heating_setpoint: 20.0
    cooling_setpoint: 27.0
    heating_capacity: 1000000.0
    cooling_capacity: 1000000.0

surfaces:
  - name: South Wall
    zone: Case395 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  - name: North Wall
    zone: Case395 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}

  - name: East Wall
    zone: Case395 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  - name: West Wall
    zone: Case395 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Roof
    zone: Case395 Zone
    type: roof
    construction: Case600 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Floor
    zone: Case395 Zone
    type: floor
    construction: Case600 Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
