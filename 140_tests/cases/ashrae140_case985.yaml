# OpenBSE ASHRAE Standard 140 — Case 985
#
# Case 985: High-Mass 20/20 Thermostat (No Deadband)
#
# Single-zone high-mass building in Denver, CO (Golden, CO weather)
# Reference: ASHRAE Standard 140-2023, Section 7.2.2.2
#
# Building: 8m (E-W) x 6m (N-S) x 2.7m height = 129.6 m3
# Same as Case 900 except thermostat has no deadband:
#   Heating setpoint: 20.0C
#   Cooling setpoint: 20.0C
# This means the zone is maintained at exactly 20C at all times.
#
# (Case 985 is to Case 900 as Case 685 is to Case 600.)
#
# High-mass construction (Table 7-27): concrete block walls, concrete slab floor
# Two south-facing windows: each 3m wide x 2m tall
# 0.5 ACH infiltration, 200W internal gains
#
# Coordinate system: X=East, Y=North, Z=Up
# Origin: SW corner of floor at ground level
#
# HVAC: Ideal loads air system, nonproportional thermostat
#   Heat ON if T < 20C, Cool ON if T > 20C (no deadband)
#   Capacity: 1 MW each (effectively unlimited)
#   All energy 100% convective to zone air
#
# Vertex order: Counter-clockwise from outside (Newell convention)

simulation:
  timesteps_per_hour: 4
  terrain: country
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31

weather_files:
  - "ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv"

# --- Simple Constructions -------------------------------------------------------
# Case 900 high-mass constructions (Table 7-27).
# ─── Opaque Constructions ──────────────────────────────────────────────────
# Layer properties of ASHRAE 140-2023 Section 7.2: the material tables for
# Cases 600, 680, 900, 960 (common wall) and 980, numbered Tables 5-2, 5-25,
# 5-27, 5-29 and 5-31 in 140-2017 Addendum a. Floor insulation is massless
# ("minimum density and specific heat the program allows"). Solar
# absorptance 0.6 and infrared emittance 0.9 on both faces (Table 5-5);
# exterior surfaces rough (Table 5-6).

materials:
  - name: Wood Siding
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Foam Insulation
    conductivity: 0.04
    density: 10.0
    specific_heat: 1400.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Concrete Block
    conductivity: 0.51
    density: 1400.0
    specific_heat: 1000.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Roof Deck
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Fiberglass Quilt
    conductivity: 0.04
    density: 12.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Plasterboard
    conductivity: 0.16
    density: 950.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Floor Insulation High Mass
    thermal_resistance: 25.175
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Concrete Slab
    conductivity: 1.13
    density: 1400.0
    specific_heat: 1000.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9

constructions:
  # Table 5-27, outside to inside
  - name: Case900 Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Foam Insulation
        thickness: 0.0615
      - material: Concrete Block
        thickness: 0.1
  # Table 5-2, outside to inside
  - name: Case900 Roof
    layers:
      - material: Roof Deck
        thickness: 0.019
      - material: Fiberglass Quilt
        thickness: 0.1118
      - material: Plasterboard
        thickness: 0.01
  # Table 5-27, outside to inside
  - name: Case900 Floor
    layers:
      - material: Floor Insulation High Mass
        thickness: 1.007
      - material: Concrete Slab
        thickness: 0.08

glazing_materials:
  # Clear glass pane of the standard (WINDOW 7 CLEAR_3)
  - name: Clear Glass
    thickness: 0.003175
    conductivity: 1.0
    solar_transmittance: 0.834
    solar_reflectance_front: 0.075
    solar_reflectance_back: 0.075
    emissivity_front: 0.84
    emissivity_back: 0.84

window_constructions:
  # Double-pane clear glass (same as Case 900)
  - name: Case900 Window
    # U-factor and SHGC follow from the layers.
    layers:
      - glazing: Clear Glass
      - gas: air
        width: 0.012
      - glazing: Clear Glass

# --- Outputs ---------------------------------------------------------------------

outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - zone_temperature
      - zone_heating_rate
      - zone_cooling_rate
      - site_outdoor_temperature

  - file: "energy_monthly.csv"
    frequency: monthly
    variables:
      - zone_heating_energy
      - zone_cooling_energy

summary_report: true

# --- Zone ------------------------------------------------------------------------

zones:
  - name: Case985 Zone
    solar_distribution:
      floor_fraction: 0.642
      wall_fraction: 0.191
      ceiling_fraction: 0.167

equipment:
  - name: Internal Gains
    zones: [Case985 Zone]
    power: 200.0
    fuel: none
    radiant_fraction: 0.6

infiltration:
  - name: Zone Infiltration
    zones: [Case985 Zone]
    air_changes_per_hour: 0.5

# Ideal loads air system — no deadband thermostat
# Both heating and cooling setpoints at 20C
ideal_loads:
  - name: Zone Ideal Loads
    zones: [Case985 Zone]
    heating_setpoint: 20.0
    cooling_setpoint: 20.0
    heating_capacity: 1000000.0
    cooling_capacity: 1000000.0

# --- Surfaces with 3D Vertices --------------------------------------------------

surfaces:
  - name: South Wall
    zone: Case985 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  - name: South Window 1
    zone: Case985 Zone
    type: window
    construction: Case900 Window
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 0.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 2.2}
      - {x: 0.5, y: 0.0, z: 2.2}

  - name: South Window 2
    zone: Case985 Zone
    type: window
    construction: Case900 Window
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 4.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 2.2}
      - {x: 4.5, y: 0.0, z: 2.2}

  - name: North Wall
    zone: Case985 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}

  - name: East Wall
    zone: Case985 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  - name: West Wall
    zone: Case985 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Roof
    zone: Case985 Zone
    type: roof
    construction: Case900 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Floor
    zone: Case985 Zone
    type: floor
    construction: Case900 Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
