# OpenBSE ASHRAE Standard 140 — Case 200
#
# Case 200: Infrared radiation
# ASHRAE Standard 140-2023, Section 7.2.3.4 (in-depth test, 7.2.3).
# Base cases (Informative Table 7-33): 210, 215.
#
# Case 600 except:
#   - Infiltration 0 ach (7.2.3.1.1); internal gains 0 W (7.2.3.1.2)
#   - Opaque surfaces per Table 7-34: interior solar 0.6, exterior solar 0.1, IR
#     0.9 both faces; raised floor exterior gets no solar (7.2.3.1.3)
#   - High-conductance wall elements replace the 12 m2 of south windows
#     (7.2.3.1.4, Tables 7-35, 7-36)
#   - "20,20" nonproportional thermostat (7.2.3.1.5)
#   - Interior IR emittance 0.1 (7.2.3.2.1, from Case 210)
#   - Exterior IR emittance 0.1 on all opaque surfaces (7.2.3.4.1)
#
# Generated by 140_tests/scripts/generate_indepth_cases.py; edit there.
# No acceptance ranges (Annex A3 has none for 7.2.3); results reported only.
# Coordinates: X = east, Y = north, Z = up; vertices counter-clockwise
# seen from outside.

simulation:
  timesteps_per_hour: 4
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  terrain: country
  solar_distribution: full_interior_and_exterior

weather_files:
  - "ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv"

materials:
  - name: Wood Siding
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.1
    roughness: rough
  - name: Fiberglass Quilt
    conductivity: 0.04
    density: 12.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Plasterboard
    conductivity: 0.16
    density: 950.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.1
  - name: Roof Deck
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.1
    roughness: rough
  - name: Floor Insulation Low Mass
    thermal_resistance: 25.075
    solar_absorptance: 0.6
    thermal_absorptance: 0.1
    roughness: rough
  - name: Timber Flooring
    conductivity: 0.14
    density: 650.0
    specific_heat: 1200.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.1
  - name: HCWE Outer Panel
    conductivity: 1.0
    density: 2470.0
    specific_heat: 750.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.1
    roughness: very_smooth
  - name: HCWE Air Gap
    conductivity: 0.0625
    density: 1.292498
    specific_heat: 1006.103271
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: HCWE Inner Panel
    conductivity: 1.0
    density: 2470.0
    specific_heat: 750.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.1
    roughness: very_smooth

constructions:
  # Table 7-2, outside to inside
  - name: Case600 Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Fiberglass Quilt
        thickness: 0.066
      - material: Plasterboard
        thickness: 0.012
  # Table 7-2, outside to inside
  - name: Case600 Roof
    layers:
      - material: Roof Deck
        thickness: 0.019
      - material: Fiberglass Quilt
        thickness: 0.1118
      - material: Plasterboard
        thickness: 0.01
  # Table 7-2, outside to inside
  - name: Case600 Floor
    layers:
      - material: Floor Insulation Low Mass
        thickness: 1.003
      - material: Timber Flooring
        thickness: 0.025
  # Table 7-36, outside to inside
  - name: High-Conductance Wall Element
    layers:
      - material: HCWE Outer Panel
        thickness: 0.003048
      - material: HCWE Air Gap
        thickness: 0.012
      - material: HCWE Inner Panel
        thickness: 0.003048

# Output of 7.3.1: annual loads and hourly integrated peaks.
outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - zone_temperature
      - zone_heating_rate
      - zone_cooling_rate
      - site_outdoor_temperature

summary_report: true

zones:
  - name: Case200 Zone

# Ideal loads: nonproportional thermostat (7.2.1.13.1.2), 1000 kW each,
# 100% convective.
ideal_loads:
  - name: Zone Ideal Loads
    zones: [Case200 Zone]
    heating_setpoint: 20.0
    cooling_setpoint: 20.0
    heating_capacity: 1000000.0
    cooling_capacity: 1000000.0

surfaces:
  - name: South Wall
    zone: Case200 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  - name: High-Conductance Wall Element 1
    zone: Case200 Zone
    type: wall
    construction: High-Conductance Wall Element
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 0.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 2.2}
      - {x: 0.5, y: 0.0, z: 2.2}

  - name: High-Conductance Wall Element 2
    zone: Case200 Zone
    type: wall
    construction: High-Conductance Wall Element
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 4.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 2.2}
      - {x: 4.5, y: 0.0, z: 2.2}

  - name: North Wall
    zone: Case200 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}

  - name: East Wall
    zone: Case200 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  - name: West Wall
    zone: Case200 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Roof
    zone: Case200 Zone
    type: roof
    construction: Case600 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Floor
    zone: Case200 Zone
    type: floor
    construction: Case600 Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
