# ASHRAE 140-2023 Section 10 — Case HE220
# Fuel-fired furnace BESTEST. GENERATED by 140_tests/scripts/generate_he_cases.py.
# Weather HE210W, furnace efficiency 0.80, capacity 10.0 kW,
# fan=cycling, setback=True. Near-adiabatic shell (Table 10-2) + constant infiltration.

simulation:
  timesteps_per_hour: 1
  start_month: 1
  start_day: 1
  end_month: 3
  end_day: 31

weather_files:
  - "../weather/HE210W.csv"

# Table 10-2 (Section 10.2.1.9.2): wall 75.6 m2, floor and roof 48.0 m2, each
# k = 0.01 W/(m K), t = 1.00 m, U = 0.01 W/(m2 K) between its faces, exposed to
# outdoors (the zone is suspended above the ground, 10.2.1.7.1). No capacitance
# is specified, so the layer is resistance-only.
materials:
  - name: HE Envelope Material
    thermal_resistance: 100.0

constructions:
  - name: HE Envelope
    layers:
      - material: HE Envelope Material
        thickness: 1.0

zones:
  - name: HE220 Zone
    volume: 129.6
    floor_area: 48.0

infiltration:
  - name: HE220 Infiltration
    zones: [HE220 Zone]
    design_flow_rate: 0.16591
    density_basis: zone

surfaces:
  - {name: HE220 North Wall, zone: HE220 Zone, type: wall, construction: HE Envelope, vertices: [{x: 8.0, y: 6.0, z: 0.0},{x: 0.0, y: 6.0, z: 0.0},{x: 0.0, y: 6.0, z: 2.7},{x: 8.0, y: 6.0, z: 2.7}]}
  - {name: HE220 South Wall, zone: HE220 Zone, type: wall, construction: HE Envelope, vertices: [{x: 0.0, y: 0.0, z: 0.0},{x: 8.0, y: 0.0, z: 0.0},{x: 8.0, y: 0.0, z: 2.7},{x: 0.0, y: 0.0, z: 2.7}]}
  - {name: HE220 East Wall, zone: HE220 Zone, type: wall, construction: HE Envelope, vertices: [{x: 8.0, y: 0.0, z: 0.0},{x: 8.0, y: 6.0, z: 0.0},{x: 8.0, y: 6.0, z: 2.7},{x: 8.0, y: 0.0, z: 2.7}]}
  - {name: HE220 West Wall, zone: HE220 Zone, type: wall, construction: HE Envelope, vertices: [{x: 0.0, y: 6.0, z: 0.0},{x: 0.0, y: 0.0, z: 0.0},{x: 0.0, y: 0.0, z: 2.7},{x: 0.0, y: 6.0, z: 2.7}]}
  - {name: HE220 Roof, zone: HE220 Zone, type: roof, construction: HE Envelope, vertices: [{x: 0.0, y: 0.0, z: 2.7},{x: 8.0, y: 0.0, z: 2.7},{x: 8.0, y: 6.0, z: 2.7},{x: 0.0, y: 6.0, z: 2.7}]}
  - {name: HE220 Floor, zone: HE220 Zone, type: floor, construction: HE Envelope, vertices: [{x: 0.0, y: 6.0, z: 0.0},{x: 8.0, y: 6.0, z: 0.0},{x: 8.0, y: 0.0, z: 0.0},{x: 0.0, y: 0.0, z: 0.0}]}

air_loops:
  - name: Furnace
    controls:
      heating_supply_temp: 50.0
      cooling_supply_temp: 13.0
      cycling: on_off
      deadband: 1.0
      minimum_damper_position: 0.0
      design_zone_flow: 0.4274
      fan_operating_mode: cycling
    equipment:
      - type: heating_coil
        name: HE220 Gas Furnace
        source: gas
        capacity: 10000.0
        efficiency: 0.8
        setpoint: 50.0
        hir_curve: HE220 Furnace HIR
        parasitic_electric_load: 50.0
      - type: fan
        name: HE220 Circulating Fan
        source: constant_volume
        design_flow_rate: 0.355
        pressure_rise: 281.7
        air_density: 1.204
        motor_efficiency: 1.0
        impeller_efficiency: 0.5
        motor_in_airstream_fraction: 1.0
    zones:
      - zone: HE220 Zone

performance_curves:
  # Section 10.2.1.10.4: HIR(PLR) = a + b PLR + c PLR^2 + d PLR^3.
  - name: HE220 Furnace HIR
    curve_type: cubic
    coefficients: [0.0080472574, 0.87564457, 0.29249943, -0.17624156]
    min_x: 0.0
    max_x: 1.0

zone_groups:
  - name: HE220 Zone Group
    zones: [HE220 Zone]

thermostats:
  - name: HE220 Thermostat
    zones: [HE220 Zone Group]
    heating_setpoint: 20.0
    cooling_setpoint: 99.0
    thermostat_schedule:
      - {start_hour: 24, end_hour: 6, heating_setpoint: 15.0, cooling_setpoint: 99.0}
      - {start_hour: 7, end_hour: 23, heating_setpoint: 20.0, cooling_setpoint: 99.0}

outputs:
  - file: "hvac_results.csv"
    frequency: hourly
    variables:
      - "component:thermal_output"
      - "component:fuel_power"
      - "component:electric_power"
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - "zone:temperature"

summary_report: true
