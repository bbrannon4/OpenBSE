# ASHRAE Standard 140-2023 — Case CE195
# Section 9a: Cooling Equipment (HVAC BESTEST) — GENERATED by
# 140_tests/scripts/generate_ce_cases.py; do not edit by hand.
#
# Weather CE100A (ODB constant), cooling setpoint 22.2 C,
# internal gain 820 W (270 W sensible + 550 W latent).
# Adiabatic single-zone shell; window-AC DX system (8181 W gross, condenser
# fan 108 W, cycling supply fan). February totals compared to the analytical
# solution (CE100MAP.xls / Std140_CE_a_Results.xlsx).

simulation:
  timesteps_per_hour: 1
  start_month: 1
  start_day: 1
  end_month: 3
  end_day: 31

weather_files:
  - "CE100A.csv"

simple_constructions:
  - name: Adiabatic Wall
    u_factor: 0.01
    thickness: 0.01
    thermal_capacity: 0.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.9
    roughness: rough

zones:
  - name: CE195 Zone
    volume: 129.6
    floor_area: 48.0

equipment:
  - name: CE195 Internal Load
    zones: [CE195 Zone]
    power: 820.0
    radiant_fraction: 0.0
    latent_fraction: 0.670732

surfaces:
  - name: CE195 North Wall
    zone: CE195 Zone
    type: wall
    construction: Adiabatic Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
  - name: CE195 South Wall
    zone: CE195 Zone
    type: wall
    construction: Adiabatic Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}
  - name: CE195 East Wall
    zone: CE195 Zone
    type: wall
    construction: Adiabatic Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
  - name: CE195 West Wall
    zone: CE195 Zone
    type: wall
    construction: Adiabatic Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}
  - name: CE195 Roof
    zone: CE195 Zone
    type: roof
    construction: Adiabatic Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}
  - name: CE195 Floor
    zone: CE195 Zone
    type: floor
    construction: Adiabatic Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}

air_loops:
  - name: Window AC
    controls:
      cooling_supply_temp: 13.0
      heating_supply_temp: 40.0
      cycling: proportional
      deadband: 1.0
      minimum_damper_position: 0.0
      design_zone_flow: 0.51
      cooling_part_load_cd: 0.229    # HVAC BESTEST CDF = 0.771 + 0.229*PLR
    equipment:
      - type: cooling_coil
        name: CE195 DX Cooling Coil
        source: dx
        capacity: 8181.3
        cop: 4.3986
        shr: 0.7774
        rated_airflow: 0.4248
        setpoint: 13.0
        condenser_fan_power: 108.0
        cap_ft_curve: "CE DX CapFT"
        eir_ft_curve: "CE DX EIRFT"
      - type: fan
        name: CE195 Supply Fan
        source: on_off
        design_flow_rate: 0.425
        pressure_rise: 271.0
        motor_efficiency: 1.0
        impeller_efficiency: 0.5
        motor_in_airstream_fraction: 1.0
    zones:
      - zone: CE195 Zone

zone_groups:
  - name: CE195 Zone Group
    zones:
      - CE195 Zone

thermostats:
  - name: CE195 Thermostat
    zones: [CE195 Zone Group]
    cooling_setpoint: 22.2
    heating_setpoint: 10.0

outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - "zone:temperature"
      - "zone:humidity_ratio"
  - file: "hvac_results.csv"
    frequency: hourly
    variables:
      - "component:compressor_power"
      - "component:condenser_fan_power"
      - "component:electric_power"
      - "component:total_load"
      - "component:sensible_load"
      - "component:latent_load"

summary_report: true

performance_curves:

  - name: CE DX CapFT
    table:
      axes:
        - variable: indoor_wet_bulb
          values: [15.0000, 17.2222, 19.4444, 21.6667]
          extrapolation: linear
        - variable: outdoor_dry_bulb
          values: [29.4444, 32.2222, 35.0000, 37.7778, 40.5556, 46.1111]
          extrapolation: linear
      values:
        - [0.90689, 0.88540, 0.86033, 0.83884, 0.81377, 0.76363]
        - [0.97851, 0.95344, 0.92837, 0.90331, 0.87465, 0.82094]
        - [1.05730, 1.02865, 1.00000, 0.97135, 0.93912, 0.88182]
        - [1.13609, 1.10386, 1.07521, 1.03939, 1.00716, 0.94270]
      output_min: 0.0

  - name: CE DX EIRFT
    table:
      axes:
        - variable: indoor_wet_bulb
          values: [15.0000, 17.2222, 19.4444, 21.6667]
          extrapolation: linear
        - variable: outdoor_dry_bulb
          values: [29.4444, 32.2222, 35.0000, 37.7778, 40.5556, 46.1111]
          extrapolation: linear
      values:
        - [0.21834, 0.23330, 0.25147, 0.26957, 0.29139, 0.33773]
        - [0.20736, 0.22306, 0.23830, 0.25574, 0.27670, 0.31863]
        - [0.19769, 0.21270, 0.22735, 0.24412, 0.26291, 0.30217]
        - [0.18935, 0.20374, 0.21713, 0.23284, 0.25000, 0.28655]
