# OpenBSE ASHRAE Standard 140 — Case 610
#
# Case 610: South Overhang
#
# Single-zone low-mass building in Denver, CO (Golden, CO weather)
# Reference: ASHRAE Standard 140-2023, Section 7.2.2.1.1
#
# Building: 8m (E-W) x 6m (N-S) x 2.7m height = 129.6 m3
# Same as Case 600 PLUS a horizontal overhang above the south windows.
#
# Overhang geometry (Table 7-8, Figure 7-10):
#   Depth: 1.0m (projection south from wall)
#   Width: 8.0m (full south wall width)
#   Height: z = 2.7m (0.5m above window top at z=2.2m)
#
# Coordinate system: X=East, Y=North, Z=Up
# Origin: SW corner of floor at ground level
#
# HVAC: Ideal loads air system, nonproportional thermostat
#   Heat ON if T < 20C, Cool ON if T > 27C
#   Capacity: 1 MW each (effectively unlimited)
#
# Vertex order: Counter-clockwise from outside (Newell convention)

simulation:
  timesteps_per_hour: 4
  terrain: country
  solar_distribution: full_interior_and_exterior
  shading_calculation: detailed
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31

weather_files:
  - "ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv"

# ─── Opaque Constructions ──────────────────────────────────────────────────
# Layer properties of ASHRAE 140-2023 Section 7.2: the material tables for
# Cases 600, 680, 900, 960 (common wall) and 980, numbered Tables 5-2, 5-25,
# 5-27, 5-29 and 5-31 in 140-2017 Addendum a. Floor insulation is massless
# ("minimum density and specific heat the program allows"). Solar
# absorptance 0.6 and infrared emittance 0.9 on both faces (Table 5-5);
# exterior surfaces rough (Table 5-6).

materials:
  - name: Wood Siding
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Fiberglass Quilt
    conductivity: 0.04
    density: 12.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Plasterboard
    conductivity: 0.16
    density: 950.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Roof Deck
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Floor Insulation Low Mass
    thermal_resistance: 25.075
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Timber Flooring
    conductivity: 0.14
    density: 650.0
    specific_heat: 1200.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9

constructions:
  # Table 5-2, outside to inside
  - name: Case600 Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Fiberglass Quilt
        thickness: 0.066
      - material: Plasterboard
        thickness: 0.012
  # Table 5-2, outside to inside
  - name: Case600 Roof
    layers:
      - material: Roof Deck
        thickness: 0.019
      - material: Fiberglass Quilt
        thickness: 0.1118
      - material: Plasterboard
        thickness: 0.01
  # Table 5-2, outside to inside
  - name: Case600 Floor
    layers:
      - material: Floor Insulation Low Mass
        thickness: 1.003
      - material: Timber Flooring
        thickness: 0.025

glazing_materials:
  # Clear glass pane of the standard (WINDOW 7 CLEAR_3)
  - name: Clear Glass
    thickness: 0.003048    # 3.048 mm (Section 7.2, Table 5-10)
    conductivity: 1.0
    solar_transmittance: 0.834
    solar_reflectance_front: 0.075
    solar_reflectance_back: 0.075
    emissivity_front: 0.84
    emissivity_back: 0.84

window_constructions:
  - name: Case600 Window
    # U-factor and SHGC follow from the layers.
    layers:
      - glazing: Clear Glass
      - gas: air
        width: 0.012
      - glazing: Clear Glass

# ─── Outputs ──────────────────────────────────────────────────────────────────

outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - zone_temperature
      - zone_heating_rate
      - zone_cooling_rate
      - site_outdoor_temperature

  - file: "energy_monthly.csv"
    frequency: monthly
    variables:
      - zone_heating_energy
      - zone_cooling_energy

summary_report: true

# ─── Zone ────────────────────────────────────────────────────────────────────

zones:
  - name: Case610 Zone

equipment:
  - name: Internal Gains
    zones: [Case610 Zone]
    power: 200.0
    fuel: none
    radiant_fraction: 0.6

infiltration:
  - name: Zone Infiltration
    zones: [Case610 Zone]
    air_changes_per_hour: 0.5

ideal_loads:
  - name: Zone Ideal Loads
    zones: [Case610 Zone]
    heating_setpoint: 20.0
    cooling_setpoint: 27.0
    heating_capacity: 1000000.0
    cooling_capacity: 1000000.0

# ─── Shading Surfaces ─────────────────────────────────────────────────────────
# Case 610: Horizontal overhang above south windows.
#
# The overhang is at z=2.7m (top of south wall), spanning the full 8m width,
# projecting 1.0m south from the wall plane (y=0 to y=-1.0).
#
# Vertices CCW from below (normal points down — visible from below the overhang).

shading_surfaces:
  - name: South Overhang
    vertices:
      - {x: 0.0, y:  0.0, z: 2.7}
      - {x: 0.0, y: -1.0, z: 2.7}
      - {x: 8.0, y: -1.0, z: 2.7}
      - {x: 8.0, y:  0.0, z: 2.7}

# ─── Surfaces with 3D Vertices ──────────────────────────────────────────────
# Same as Case 600.

surfaces:
  # ── South Wall (faces south, normal = -Y) ──────────────────────────
  - name: South Wall
    zone: Case610 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  # ── South Window 1 (west side) ─────────────────────────────────────
  - name: South Window 1
    zone: Case610 Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 0.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 2.2}
      - {x: 0.5, y: 0.0, z: 2.2}

  # ── South Window 2 (east side) ─────────────────────────────────────
  - name: South Window 2
    zone: Case610 Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 4.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 2.2}
      - {x: 4.5, y: 0.0, z: 2.2}

  # ── North Wall (faces north, normal = +Y) ──────────────────────────
  - name: North Wall
    zone: Case610 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}

  # ── East Wall (faces east, normal = +X) ────────────────────────────
  - name: East Wall
    zone: Case610 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  # ── West Wall (faces west, normal = -X) ────────────────────────────
  - name: West Wall
    zone: Case610 Zone
    type: wall
    construction: Case600 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  # ── Roof (faces up, normal = +Z) ───────────────────────────────────
  - name: Roof
    zone: Case610 Zone
    type: roof
    construction: Case600 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  # ── Floor (faces down, normal = -Z) ────────────────────────────────
  - name: Floor
    zone: Case610 Zone
    type: floor
    construction: Case600 Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
