# ASHRAE 140-2023 Section 10 — Case HE120
# Fuel-fired furnace BESTEST. GENERATED by 140_tests/scripts/generate_he_cases.py.
# Weather FurnBest-c, furnace efficiency 0.80, capacity 10.0 kW,
# fan=None, setback=False. Adiabatic shell + constant infiltration.

simulation:
  timesteps_per_hour: 1
  start_month: 1
  start_day: 1
  end_month: 3
  end_day: 31

weather_files:
  - "../weather/FurnBest-c.epw"

simple_constructions:
  - name: Adiabatic Wall
    u_factor: 0.01
    thickness: 0.01
    thermal_capacity: 0.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.9
    roughness: rough

zones:
  - name: HE120 Zone
    volume: 129.6
    floor_area: 48.0

infiltration:
  - name: HE120 Infiltration
    zones: [HE120 Zone]
    design_flow_rate: 0.1657
    density_basis: zone

surfaces:
  - {name: HE120 North Wall, zone: HE120 Zone, type: wall, construction: Adiabatic Wall, boundary: adiabatic, vertices: [{x: 8.0, y: 6.0, z: 0.0},{x: 0.0, y: 6.0, z: 0.0},{x: 0.0, y: 6.0, z: 2.7},{x: 8.0, y: 6.0, z: 2.7}]}
  - {name: HE120 South Wall, zone: HE120 Zone, type: wall, construction: Adiabatic Wall, boundary: adiabatic, vertices: [{x: 0.0, y: 0.0, z: 0.0},{x: 8.0, y: 0.0, z: 0.0},{x: 8.0, y: 0.0, z: 2.7},{x: 0.0, y: 0.0, z: 2.7}]}
  - {name: HE120 East Wall, zone: HE120 Zone, type: wall, construction: Adiabatic Wall, boundary: adiabatic, vertices: [{x: 8.0, y: 0.0, z: 0.0},{x: 8.0, y: 6.0, z: 0.0},{x: 8.0, y: 6.0, z: 2.7},{x: 8.0, y: 0.0, z: 2.7}]}
  - {name: HE120 West Wall, zone: HE120 Zone, type: wall, construction: Adiabatic Wall, boundary: adiabatic, vertices: [{x: 0.0, y: 6.0, z: 0.0},{x: 0.0, y: 0.0, z: 0.0},{x: 0.0, y: 0.0, z: 2.7},{x: 0.0, y: 6.0, z: 2.7}]}
  - {name: HE120 Roof, zone: HE120 Zone, type: roof, construction: Adiabatic Wall, boundary: adiabatic, vertices: [{x: 0.0, y: 0.0, z: 2.7},{x: 8.0, y: 0.0, z: 2.7},{x: 8.0, y: 6.0, z: 2.7},{x: 0.0, y: 6.0, z: 2.7}]}
  - {name: HE120 Floor, zone: HE120 Zone, type: floor, construction: Adiabatic Wall, boundary: adiabatic, vertices: [{x: 0.0, y: 6.0, z: 0.0},{x: 8.0, y: 6.0, z: 0.0},{x: 8.0, y: 0.0, z: 0.0},{x: 0.0, y: 0.0, z: 0.0}]}

air_loops:
  - name: Furnace
    controls:
      heating_supply_temp: 50.0
      cooling_supply_temp: 13.0
      cycling: on_off
      deadband: 1.0
      minimum_damper_position: 0.0
      design_zone_flow: 0.5
      fan_operating_mode: cycling
    equipment:
      - type: heating_coil
        name: HE120 Gas Furnace
        source: gas
        capacity: 10000.0
        efficiency: 0.8
        setpoint: 50.0
    zones:
      - zone: HE120 Zone

zone_groups:
  - name: HE120 Zone Group
    zones: [HE120 Zone]

thermostats:
  - name: HE120 Thermostat
    zones: [HE120 Zone Group]
    heating_setpoint: 20.0
    cooling_setpoint: 99.0

outputs:
  - file: "hvac_results.csv"
    frequency: hourly
    variables:
      - "component:thermal_output"
      - "component:fuel_power"
      - "component:electric_power"
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - "zone:temperature"

summary_report: true
