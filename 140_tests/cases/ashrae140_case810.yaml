# OpenBSE ASHRAE Standard 140 — Case 810
#
# Case 810: High-mass cavity albedo
# ASHRAE Standard 140-2023, Section 7.2.3.25 (in-depth test, 7.2.3).
# Base cases (Informative Table 7-33): 900, 280.
#
# Case 900 except:
#   - Case 900 exterior wall and floor materials (Table 7-27)
#   - Interior solar absorptance 0.1 on all opaque surfaces (7.2.3.25.1)
#   - Interior solar distribution calculated by the program (7.2.3.25.2,
#     7.2.3.10.2.1)
#
# Generated by 140_tests/scripts/generate_indepth_cases.py; edit there.
# No acceptance ranges (Annex A3 has none for 7.2.3); results reported only.
# Coordinates: X = east, Y = north, Z = up; vertices counter-clockwise
# seen from outside.

simulation:
  timesteps_per_hour: 4
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  terrain: country
  solar_distribution: full_interior_and_exterior

weather_files:
  - "ASHRAE 140-2023 Accompanying FIles/Std140_TF_Files/Normative Materials/725650TY.csv"

materials:
  - name: Wood Siding
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Foam Insulation
    conductivity: 0.04
    density: 10.0
    specific_heat: 1400.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Concrete Block
    conductivity: 0.51
    density: 1400.0
    specific_heat: 1000.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.9
  - name: Roof Deck
    conductivity: 0.14
    density: 530.0
    specific_heat: 900.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Fiberglass Quilt
    conductivity: 0.04
    density: 12.0
    specific_heat: 840.0
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
  - name: Plasterboard
    conductivity: 0.16
    density: 950.0
    specific_heat: 840.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.9
  - name: Floor Insulation High Mass
    thermal_resistance: 25.175
    solar_absorptance: 0.6
    thermal_absorptance: 0.9
    roughness: rough
  - name: Concrete Slab
    conductivity: 1.13
    density: 1400.0
    specific_heat: 1000.0
    solar_absorptance: 0.1
    thermal_absorptance: 0.9

constructions:
  # Table 7-27, outside to inside
  - name: Case900 Wall
    layers:
      - material: Wood Siding
        thickness: 0.009
      - material: Foam Insulation
        thickness: 0.0615
      - material: Concrete Block
        thickness: 0.1
  # Table 7-2, outside to inside
  - name: Case600 Roof
    layers:
      - material: Roof Deck
        thickness: 0.019
      - material: Fiberglass Quilt
        thickness: 0.1118
      - material: Plasterboard
        thickness: 0.01
  # Table 7-27, outside to inside
  - name: Case900 Floor
    layers:
      - material: Floor Insulation High Mass
        thickness: 1.007
      - material: Concrete Slab
        thickness: 0.08

glazing_materials:
  # Clear glass pane of Table 7-10
  - name: Clear Glass
    thickness: 0.003048
    conductivity: 1.0
    solar_transmittance: 0.834
    solar_reflectance_front: 0.075
    solar_reflectance_back: 0.075
    emissivity_front: 0.84
    emissivity_back: 0.84

window_constructions:
  # Table 7-10: two clear panes, 12.0 mm air gap
  - name: Case600 Window
    layers:
      - glazing: Clear Glass
      - gas: air
        width: 0.012
      - glazing: Clear Glass

# Output of 7.3.1: annual loads and hourly integrated peaks.
outputs:
  - file: "zone_results.csv"
    frequency: hourly
    variables:
      - zone_temperature
      - zone_heating_rate
      - zone_cooling_rate
      - site_outdoor_temperature

summary_report: true

zones:
  - name: Case810 Zone

equipment:
  - name: Internal Gains
    zones: [Case810 Zone]
    power: 200.0
    fuel: none
    radiant_fraction: 0.6

infiltration:
  - name: Zone Infiltration
    zones: [Case810 Zone]
    air_changes_per_hour: 0.5

# Ideal loads: nonproportional thermostat (7.2.1.13.1.2), 1000 kW each,
# 100% convective.
ideal_loads:
  - name: Zone Ideal Loads
    zones: [Case810 Zone]
    heating_setpoint: 20.0
    cooling_setpoint: 27.0
    heating_capacity: 1000000.0
    cooling_capacity: 1000000.0

surfaces:
  - name: South Wall
    zone: Case810 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 0.0, z: 2.7}

  - name: South Window 1
    zone: Case810 Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 0.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 0.2}
      - {x: 3.5, y: 0.0, z: 2.2}
      - {x: 0.5, y: 0.0, z: 2.2}

  - name: South Window 2
    zone: Case810 Zone
    type: window
    construction: Case600 Window
    boundary: outdoor
    parent_surface: South Wall
    vertices:
      - {x: 4.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 0.2}
      - {x: 7.5, y: 0.0, z: 2.2}
      - {x: 4.5, y: 0.0, z: 2.2}

  - name: North Wall
    zone: Case810 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}

  - name: East Wall
    zone: Case810 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}

  - name: West Wall
    zone: Case810 Zone
    type: wall
    construction: Case900 Wall
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Roof
    zone: Case810 Zone
    type: roof
    construction: Case600 Roof
    boundary: outdoor
    vertices:
      - {x: 0.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 0.0, z: 2.7}
      - {x: 8.0, y: 6.0, z: 2.7}
      - {x: 0.0, y: 6.0, z: 2.7}

  - name: Floor
    zone: Case810 Zone
    type: floor
    construction: Case900 Floor
    boundary: outdoor
    sun_exposure: false
    wind_exposure: false
    vertices:
      - {x: 0.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 6.0, z: 0.0}
      - {x: 8.0, y: 0.0, z: 0.0}
      - {x: 0.0, y: 0.0, z: 0.0}
