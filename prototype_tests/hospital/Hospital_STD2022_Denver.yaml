# AirLoopHVAC: seven VAV reheat loops and the kitchen's constant-volume unit.
# Each loop: AirLoopHVAC:OutdoorAirSystem (heat-recovery wheel where the
# IDF has one), Coil:Cooling:Water, Coil:Heating:Water (sized to zero by
# Sizing:System, so left out: INPUT_AUDIT.md), Fan, humidifier.
air_loops:
  # VAV_1: VAV reheat; Controller:OutdoorAir DifferentialDryBulb, FixedMinimum minimum
  - name: VAV_1
    system_type: vav
    availability_schedule: HVACOperationSchd
    night_cycle:                       # AvailabilityManager:NightCycle
      control: cycle_on_any
      thermostat_tolerance: 1.0
      cycling_run_time: 1800
    min_vav_fraction: 0.3
    controls:
      cooling_supply_temp: 12.8   # Sizing:System central cooling
      heating_supply_temp: 40.0          # Sizing:Zone heating supply
      central_heating_supply_temp: -15.0   # Sizing:System central heating (sizes reheat)
      design_zone_flow: autosize
      cycling: proportional
      zone_sum: coincident   # Sizing:System Coincident
      minimum_damper_position: 0.25   # BLDG_OA_FRAC_SCH
      minimum_oa_schedule: BLDG_OA_FRAC_SCH normalized
      economizer:
        economizer_type: differential_dry_bulb
    dcv: true                          # Controller:MechanicalVentilation VRP
    equipment:
      - type: heat_recovery              # HeatExchanger:AirToAir:SensibleAndLatent (Rotary)
        name: VAV_1 OA Heat Recovery
        source: wheel
        sensible_effectiveness: 0.7
        cooling_sensible_effectiveness: 0.75
        latent_effectiveness: 0.6
        parasitic_power: 3154.479
      - type: cooling_coil               # Coil:Cooling:Water
        name: VAV_1 Cooling Coil
        source: chilled_water
        capacity: autosize
        setpoint: 12.8
        plant_loop: CoolSys1
      - type: fan                        # Fan:VariableVolume
        name: VAV_1 Fan
        source: vav
        design_flow_rate: autosize
        pressure_rise: 1389.42
        motor_efficiency: 0.945
        impeller_efficiency: 0.65   # total 0.61425 / motor 0.945
        motor_in_airstream_fraction: 1.0
        vav_coefficients: [0.0408, 0.088, -0.0729, 0.9437, 0.0]
    zone_terminals:
      - zone: Basement
        terminal:
          type: vav_box
          name: Basement VAV Box Component
          max_air_flow: autosize
          min_flow_fraction: 0.39   # Constant Minimum Air Flow Fraction
          reheat_type: hot_water
          reheat_capacity: autosize
          plant_loop: HeatSys1
          max_reheat_temp: 40.0
          max_reheat_fraction: 0.5
