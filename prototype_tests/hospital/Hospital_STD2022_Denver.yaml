# PlantLoop / CondenserLoop. CoolSys1 is the IDF's primary loop (two
# chillers, constant-speed pumps) and secondary loop (variable-speed pump)
# joined by an ideal HeatExchanger:FluidToFluid, as one decoupled loop
# here (the secondary pump on the demand side); the
# heat-recovery chiller recovers its condenser heat to HeatSys1
# (INPUT_AUDIT.md).
plant_loops:
  - name: HeatSys1
    design_supply_temp: 48.89   # Sizing:Plant
    design_delta_t: 13.89
    setpoint_reset:                    # SetpointManager:OutdoorAirReset
      type: oa_reset
      sp_max: 60.0
      oa_low: -6.7
      sp_min: 48.89
      oa_high: 10.0
    supply_equipment:
      - type: pump                     # Pump:VariableSpeed
        name: HeatSys1 Pump
        pump_type: variable_speed
        design_flow_rate: autosize
        design_head: 180705.7
        motor_efficiency: 0.909
        impeller_efficiency: 0.6667111141   # 1 / shaft power per flow per head 1.4999
