# ============================================================================
# OpenBSE Model: DOE ASHRAE 90.1-2022 Hospital Prototype (Denver, 5B)
# ============================================================================
#
# Transcribed object by object from PNNL's prototype IDF
# ASHRAE901_Hospital_STD2022_Denver.idf (E+ 22.1), kept with its E+ results in
# prototype_tests/hospital/eplus_run/. Generated by
# prototype_tests/hospital/hospital_from_idf.py; E+ names, vertices (rotated by
# the Building's north axis, -90.0 deg), layers and values are kept.
# prototype_tests/hospital/INPUT_AUDIT.md lists every IDF object, how it is
# represented here, and what OpenBSE cannot express.
#
# Building: basement + 5 storeys, 22,422 m², 55 zones. Seven VAV reheat air
# loops and a constant-volume kitchen unit; chilled water from two
# water-cooled chillers and a heat-recovery chiller, hot water from a gas
# boiler. The IDF's 17 multiplied zones are each one zone N times as large
# (module docstring of the generator). Origin at the IDF's, X east, Y north.
# ============================================================================

simulation:
  timesteps_per_hour: 6            # IDF Timestep
  start_month: 1
  start_day: 1
  end_month: 12
  end_day: 31
  terrain: city                    # Building: Terrain
  solar_distribution: full_interior_and_exterior
  heating_sizing_factor: 1.0       # Sizing:Parameters
  cooling_sizing_factor: 1.0
  unmet_heating_tolerance: 0.556   # OutputControl:ReportingTolerances (1 F)
  unmet_cooling_tolerance: 0.556
  sizing_averaging_window: 6       # Sizing:Parameters timesteps in averaging window
  auto_cooling_design_days: false  # size on the IDF's two design days only
  daylight_saving_time: {start: 2nd Sunday in March, end: 1st Sunday in November}   # RunPeriodControl:DaylightSavingTime
  # Site:GroundTemperature:FCfactorMethod: the only ground surfaces are the
  # basement's Construction:CfactorUndergroundWall walls, which see these.
  ground_surface_temperatures: [7.1, 3.0, -1.0, 0.8, -0.2, 4.8, 6.1, 13.7, 22.2, 22.7, 21.7, 18.5]
  # RunPeriodControl:SpecialDays (the run starts on a Sunday, 2017 calendar)
  holidays:
    - {month: 1, day: 1}   # New Years Day
    - {month: 1, day: 16}   # MLK Day
    - {month: 2, day: 20}   # Presidents Day
    - {month: 5, day: 29}   # Memorial Day
    - {month: 7, day: 4}   # Independence Day
    - {month: 9, day: 4}   # Labor Day
    - {month: 10, day: 9}   # Columbus Day
    - {month: 11, day: 11}   # Veterans Day
    - {month: 11, day: 23}   # Thanksgiving
    - {month: 12, day: 25}   # Christmas

weather_files:
  - "../../weather/USA_CO_Denver-Aurora-Buckley.AFB.724695_TMY3.epw"   # as the E+ run

